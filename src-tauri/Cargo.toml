[package]
name = "cartera-tracker"
version = "0.1.0"
description = "Seguimiento de cartera (acciones, CEDEARs, bonos) con cotizaciones manuales via data912.com"
edition = "2021"

# No usamos build scripts extra: solo el generado por tauri-build.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls en vez de openssl: evita depender de libssl-dev en el sistema (util en WSL/Windows).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
